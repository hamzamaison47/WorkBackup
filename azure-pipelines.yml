trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'

stages:

# ─────────────────────────────
# STAGE 1: INSTALL
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'
          displayName: Install Node

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install dependencies


# ─────────────────────────────
# STAGE 2: ANDROID (FIXED EVERYTHING)
# ─────────────────────────────
- stage: Android
  displayName: Build Android APK
  dependsOn: Install
  jobs:
    - job: android
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # ───── FIREBASE CONFIG FIX ─────
        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: 'google-services.json'

        - script: |
            mkdir -p android/app
            cp $(googleServices.secureFilePath) android/app/google-services.json
          displayName: Place google-services.json

        # ───── KEYSTORE FIX ─────
        - task: DownloadSecureFile@1
          name: keystoreFile
          inputs:
            secureFile: 'debug.keystore'

        - script: |
            cp $(keystoreFile.secureFilePath) android/app/debug.keystore
          displayName: Place keystore

        # ───── BUILD ANDROID ─────
        - script: |
            cd android
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleRelease --stacktrace
          displayName: Build Android APK

        # ───── ARTIFACT ─────
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'android/app/build/outputs/apk/release'
            artifactName: 'android-apk'


# ─────────────────────────────
# STAGE 3: IOS (FULL FIXED)
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: ios
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # ───── CLEAN PODS (VERY IMPORTANT) ─────
        - script: |
            cd ios
            rm -rf Pods Podfile.lock build
            pod install
          displayName: Clean CocoaPods

        # ───── CLEAN XCODE ─────
        - script: |
            xcodebuild clean -workspace ios/Authentication.xcworkspace \
            -scheme Authentication
          displayName: Clean Xcode

        # ───── ARCHIVE ─────
        - script: |
            xcodebuild -workspace ios/Authentication.xcworkspace \
            -scheme Authentication \
            -configuration Release \
            archive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
            -allowProvisioningUpdates
          displayName: Build iOS Archive

        # ───── EXPORT IPA ─────
        - script: |
            xcodebuild -exportArchive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
            -exportPath $(Build.ArtifactStagingDirectory)/ipa \
            -exportOptionsPlist ios/exportOptions.plist
          displayName: Export IPA

        # ───── ARTIFACT ─────
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'ios-build'