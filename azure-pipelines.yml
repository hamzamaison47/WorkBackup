trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'
  APP_SCHEME: 'Authentication'

  # Android variables (from your working pipeline)
  JAVA_VERSION: '17'
  BUILD_VARIANT: 'assembleRelease'
  APK_OUTPUT_PATH: 'android/app/build/outputs/apk/release'

stages:

# ─────────────────────────────
# INSTALL
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install dependencies


# ─────────────────────────────
# ANDROID (REPLACED WITH YOUR WORKING VERSION)
# ─────────────────────────────
- stage: Android
  displayName: Build Android Release APK
  dependsOn: Install
  jobs:
    - job: BuildAPK
      pool:
        vmImage: 'ubuntu-latest'
      steps:

        - task: NodeTool@0
          displayName: 'Use Node $(NODE_VERSION)'
          inputs:
            versionSource: 'spec'
            versionSpec: '$(NODE_VERSION)'
            checkLatest: true

        - task: Cache@2
          displayName: Cache node_modules
          inputs:
            key: 'npm | "$(Agent.OS)" | package-lock.json'
            restoreKeys: |
              npm | "$(Agent.OS)"
            path: node_modules

        - script: npm install --legacy-peer-deps
          displayName: Install dependencies

        - task: JavaToolInstaller@0
          displayName: 'Use JDK $(JAVA_VERSION)'
          inputs:
            versionSpec: '$(JAVA_VERSION)'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'

        # Decode keystore
        - script: |
            echo "$(KEYSTORE_BASE64)" | base64 --decode > android/app/release.keystore
          displayName: Decode & place keystore

        # google-services.json
        - task: DownloadSecureFile@1
          displayName: Download google-services.json
          name: googleServices
          inputs:
            secureFile: 'google-services.json'

        - script: cp $(googleServices.secureFilePath) android/app/google-services.json
          displayName: Place google-services.json

        # Build
        - script: chmod +x android/gradlew
          displayName: Make gradlew executable

        - script: |
            cd android && ./gradlew $(BUILD_VARIANT) \
              -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
              -PMYAPP_UPLOAD_STORE_PASSWORD=$(STORE_PASSWORD) \
              -PMYAPP_UPLOAD_KEY_ALIAS=$(KEY_ALIAS) \
              -PMYAPP_UPLOAD_KEY_PASSWORD=$(KEY_PASSWORD) \
              --no-daemon \
              --stacktrace
          displayName: Build release APK

        # Publish APK
        - task: PublishBuildArtifacts@1
          displayName: Publish APK artifact
          inputs:
            pathToPublish: $(APK_OUTPUT_PATH)
            artifactName: Authentication-release-apk
            publishLocation: Container


# ─────────────────────────────
# IOS (UNCHANGED)
# ─────────────────────────────
- stage: iOS
  jobs:
    - job: build
      pool:
        vmImage: 'macos-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # Clean Pods
        - script: |
            cd ios
            rm -rf Pods Podfile.lock build
            pod install --repo-update
          displayName: Install Pods

        # Clean Xcode
        - script: |
            xcodebuild clean \
              -workspace ios/Authentication.xcworkspace \
              -scheme $(APP_SCHEME)
          displayName: Clean Xcode

        # Archive
        - script: |
            xcodebuild \
              -workspace ios/Authentication.xcworkspace \
              -scheme $(APP_SCHEME) \
              -configuration Release \
              archive \
              -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
              -allowProvisioningUpdates
          displayName: Build iOS Archive

        # Export IPA
        - script: |
            xcodebuild -exportArchive \
              -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
              -exportPath $(Build.ArtifactStagingDirectory)/ipa \
              -exportOptionsPlist ios/exportOptions.plist
          displayName: Export IPA

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)
            artifactName: ios-build