trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'
  APP_SCHEME: 'Authentication'

stages:

# ─────────────────────────────
# INSTALL
# ─────────────────────────────
- stage: Install
  jobs:
    - job: setup
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install dependencies


# ─────────────────────────────
# ANDROID
# ─────────────────────────────
- stage: Android
  jobs:
    - job: build
      pool:
        vmImage: 'ubuntu-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # Firebase config
        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: 'google-services.json'

        - script: |
            mkdir -p android/app
            cp $(googleServices.secureFilePath) android/app/google-services.json
          displayName: Add google-services.json

        # Keystore (BASE64 FIX - SAFE)
        - script: |
            echo "$(KEYSTORE_BASE64)" | base64 --decode > android/app/release.keystore
          displayName: Decode Keystore

        # 🔥 FIX: export env properly
        - script: |
            cd android
            chmod +x gradlew

            export MYAPP_UPLOAD_STORE_FILE=release.keystore
            export MYAPP_UPLOAD_STORE_PASSWORD="$(KEYSTORE_PASSWORD)"
            export MYAPP_UPLOAD_KEY_ALIAS="$(KEY_ALIAS)"
            export MYAPP_UPLOAD_KEY_PASSWORD="$(KEY_PASSWORD)"

            ./gradlew clean
            ./gradlew assembleRelease --stacktrace
          displayName: Build Android APK

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: android/app/build/outputs/apk/release
            artifactName: android-apk


# ─────────────────────────────
# IOS
# ─────────────────────────────
- stage: iOS
  jobs:
    - job: build
      pool:
        vmImage: 'macos-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # Clean Pods
        - script: |
            cd ios
            rm -rf Pods Podfile.lock build
            pod install --repo-update
          displayName: Install Pods

        # FIX: correct workspace path
        - script: |
            xcodebuild clean \
              -workspace ios/Authentication.xcworkspace \
              -scheme $(APP_SCHEME)
          displayName: Clean Xcode

        # Archive
        - script: |
            xcodebuild \
              -workspace ios/Authentication.xcworkspace \
              -scheme $(APP_SCHEME) \
              -configuration Release \
              archive \
              -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
              -allowProvisioningUpdates
          displayName: Build iOS Archive

        # Export IPA
        - script: |
            xcodebuild -exportArchive \
              -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
              -exportPath $(Build.ArtifactStagingDirectory)/ipa \
              -exportOptionsPlist ios/exportOptions.plist
          displayName: Export IPA

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)
            artifactName: ios-build