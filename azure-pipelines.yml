trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'ubuntu-latest'   # default pool for jobs that don't need macOS

variables:
  NODE_VERSION: '18.x'

stages:

# ─────────────────────────────
# STAGE 1: INSTALL
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'
          displayName: Install Node

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install dependencies


# ─────────────────────────────
# STAGE 2: ANDROID
# ─────────────────────────────
- stage: Android
  displayName: Build Android APK
  dependsOn: Install
  jobs:
    - job: android
      pool:
        vmImage: 'ubuntu-latest'   # Android doesn't need macOS — faster, cheaper, more reliable network
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # ───── FIREBASE CONFIG ─────
        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: 'google-services.json'

        - script: |
            mkdir -p android/app
            cp $(googleServices.secureFilePath) android/app/google-services.json
          displayName: Place google-services.json

        # ───── KEYSTORE ─────
        - task: DownloadSecureFile@1
          name: keystoreFile
          inputs:
            secureFile: 'debug.keystore'

        - script: |
            cp $(keystoreFile.secureFilePath) android/app/debug.keystore
          displayName: Place keystore

        # ───── BUILD ANDROID (with network retry/timeout hardening) ─────
        - script: |
            cd android
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleRelease --stacktrace --no-daemon \
              -Dorg.gradle.internal.http.connectionTimeout=180000 \
              -Dorg.gradle.internal.http.socketTimeout=180000 \
              -Dorg.gradle.internal.repository.max.retries=10 \
              -Dorg.gradle.internal.repository.initial.backoff=500
          displayName: Build Android APK
          retryCountOnTaskFailure: 2

        # ───── ARTIFACT ─────
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'android/app/build/outputs/apk/release'
            artifactName: 'android-apk'


# ─────────────────────────────
# STAGE 3: IOS
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: ios
      pool:
        vmImage: 'macos-latest'   # iOS builds require macOS
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # ───── DOWNLOAD SIGNING ASSETS ─────
        # Replace the secureFile names below with whatever you named them
        # when uploading to Pipelines > Library > Secure Files
        - task: DownloadSecureFile@1
          name: signingCert
          inputs:
            secureFile: 'ios_distribution.p12'

        - task: DownloadSecureFile@1
          name: provisioningProfile
          inputs:
            secureFile: 'Dynaface.mobileprovision'

        # ───── IMPORT CERTIFICATE INTO A TEMP KEYCHAIN ─────
        # P12_PASSWORD and KEYCHAIN_PASSWORD must be set as SECRET pipeline variables
        - script: |
            KEYCHAIN_PATH=$(Agent.TempDirectory)/build.keychain
            security create-keychain -p "$(KEYCHAIN_PASSWORD)" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$(KEYCHAIN_PASSWORD)" $KEYCHAIN_PATH
            security import $(signingCert.secureFilePath) -P "$(P12_PASSWORD)" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$(KEYCHAIN_PASSWORD)" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH login.keychain
          displayName: Import signing certificate into keychain

        # ───── INSTALL PROVISIONING PROFILE ─────
        - script: |
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $(provisioningProfile.secureFilePath) ~/Library/MobileDevice/Provisioning\ Profiles/
          displayName: Install provisioning profile

        # ───── CLEAN PODS ─────
        - script: |
            cd ios
            rm -rf Pods Podfile.lock build
            pod install --repo-update
          displayName: Clean CocoaPods

        # ───── CLEAN XCODE ─────
        - script: |
            xcodebuild clean -workspace ios/Authentication.xcworkspace \
            -scheme Authentication
          displayName: Clean Xcode

        # ───── ARCHIVE ─────
        - script: |
            xcodebuild -workspace ios/Authentication.xcworkspace \
            -scheme Authentication \
            -configuration Release \
            archive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive
          displayName: Build iOS Archive

        # ───── EXPORT IPA ─────
        - script: |
            xcodebuild -exportArchive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
            -exportPath $(Build.ArtifactStagingDirectory)/ipa \
            -exportOptionsPlist ios/exportOptions.plist
          displayName: Export IPA

        # ───── ARTIFACT ─────
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'ios-build'