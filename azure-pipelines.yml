trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'
  APP_SCHEME: 'Authentication'

stages:

# ─────────────────────────────
# INSTALL STAGE
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install dependencies


# ─────────────────────────────
# ANDROID STAGE
# ─────────────────────────────
- stage: Android
  displayName: Build Android APK
  dependsOn: Install
  jobs:
    - job: android
      pool:
        vmImage: 'ubuntu-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # Firebase config
        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: 'google-services.json'

        - script: |
            mkdir -p android/app
            cp $(googleServices.secureFilePath) android/app/google-services.json
          displayName: Add google-services.json

        # KEYSTORE (BASE64 FIX - YOUR ACTUAL SETUP)
        - script: |
            echo "$(KEYSTORE_BASE64)" | base64 --decode > android/app/release.keystore
          displayName: Decode Keystore

        # Android Build
        - script: |
            cd android
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleRelease \
              --stacktrace \
              -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
              -PMYAPP_UPLOAD_STORE_PASSWORD=$(KEYSTORE_PASSWORD) \
              -PMYAPP_UPLOAD_KEY_ALIAS=$(KEY_ALIAS) \
              -PMYAPP_UPLOAD_KEY_PASSWORD=$(KEY_PASSWORD)
          displayName: Build Android APK

        # Artifact
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: android/app/build/outputs/apk/release
            artifactName: android-apk


# ─────────────────────────────
# IOS STAGE (PRODUCTION READY)
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: ios
      pool:
        vmImage: 'macos-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # Clean Pods (CRITICAL FIX)
        - script: |
            cd ios
            rm -rf Pods Podfile.lock build
            pod install --repo-update
          displayName: Install Pods

        # Clean Xcode
        - script: |
            xcodebuild clean \
              -workspace Authentication.xcworkspace \
              -scheme $(APP_SCHEME)
          displayName: Clean Xcode

        # Archive iOS
        - script: |
            xcodebuild \
              -workspace ios/Authentication.xcworkspace \
              -scheme $(APP_SCHEME) \
              -configuration Release \
              archive \
              -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
              -allowProvisioningUpdates
          displayName: Build iOS Archive

        # Export IPA
        - script: |
            xcodebuild -exportArchive \
              -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
              -exportPath $(Build.ArtifactStagingDirectory)/ipa \
              -exportOptionsPlist ios/exportOptions.plist
          displayName: Export IPA

        # Artifact
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)
            artifactName: ios-build