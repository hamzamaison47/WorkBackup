trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'

stages:

# ─────────────────────────────
# STAGE 1: INSTALL
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install packages

        - script: npm run lint --if-present
          displayName: Lint code

        - script: npm test --if-present
          displayName: Run tests


# ─────────────────────────────
# STAGE 2: ANDROID BUILD (FIXED)
# ─────────────────────────────
- stage: Android
  displayName: Build Android APK
  dependsOn: Install
  jobs:
    - job: android
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # ✅ FIX: Firebase file missing issue
        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: 'google-services.json'

        - script: |
            mkdir -p android/app
            cp $(googleServices.secureFilePath) android/app/google-services.json
          displayName: Place google-services.json

        - script: |
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          displayName: Build Android Release APK

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'android/app/build/outputs/apk/release'
            artifactName: 'android-apk'


# ─────────────────────────────
# STAGE 3: IOS BUILD (FIXED)
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: ios
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        - script: |
            cd ios
            pod install
          displayName: Install CocoaPods

        # 🔥 FIX: Correct scheme MUST be used here
        - script: |
            xcodebuild -workspace ios/Authentication.xcworkspace \
            -scheme Authentication \
            -configuration Release \
            archive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive
          displayName: Build iOS Archive

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'ios-build'