trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: IDAP-Release-Signing

  - name: NODE_VERSION
    value: '18.x'

  - name: JAVA_VERSION
    value: '17'

  - name: APK_OUTPUT_PATH
    value: 'android/app/build/outputs/apk/release'

  - name: AAB_OUTPUT_PATH
    value: 'android/app/build/outputs/bundle/release'

steps:
  # 1. Install Node.js
  - task: NodeTool@0
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '$(NODE_VERSION)'

  # 2. Install Java 17
  - task: JavaToolInstaller@0
    displayName: 'Install Java 17'
    inputs:
      versionSpec: '$(JAVA_VERSION)'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # 3. Check build tools
  - bash: |
      set -e

      node --version
      npm --version
      java -version

      echo "JAVA_HOME=$JAVA_HOME"
    displayName: 'Check build tools'

  # 4. Install dependencies
  - bash: |
      set -e

      npm ci --legacy-peer-deps
    displayName: 'Install Node dependencies'

  # 5. Create Android Gradle properties and configure Hermes
  - bash: |
      set -e

      python3 - <<'PY'
      from pathlib import Path

      properties_file = Path("android/gradle.properties")

      properties_file.parent.mkdir(parents=True, exist_ok=True)

      if properties_file.exists():
          lines = properties_file.read_text(
              encoding="utf-8"
          ).splitlines()
      else:
          lines = []

      lines = [
          line for line in lines
          if not line.strip().startswith("hermesEnabled=")
      ]

      lines.append("hermesEnabled=true")

      properties_file.write_text(
          "\n".join(lines) + "\n",
          encoding="utf-8"
      )

      print("Android gradle.properties created/updated.")
      print("Hermes enabled successfully.")
      PY

      echo "Verifying Hermes configuration:"
      grep '^hermesEnabled=' android/gradle.properties

    displayName: 'Create Android Gradle properties'

  # 6. Download IDAP release keystore
  - task: DownloadSecureFile@1
    name: idapKeystore
    displayName: 'Download IDAP release keystore'
    inputs:
      secureFile: 'IDAP-release-key.keystore'

  # 7. Download Firebase configuration
  - task: DownloadSecureFile@1
    name: googleServices
    displayName: 'Download Firebase google-services.json'
    inputs:
      secureFile: 'google-services.json'

  # 8. Copy and validate Firebase configuration
  - bash: |
      set -e

      mkdir -p android/app

      cp "$(googleServices.secureFilePath)" \
        "$(Build.SourcesDirectory)/android/app/google-services.json"

      python3 - <<'PY'
      import json
      from pathlib import Path

      config_path = Path("android/app/google-services.json")

      try:
          config = json.loads(
              config_path.read_text(encoding="utf-8")
          )
      except Exception as exc:
          raise SystemExit(
              f"Invalid google-services.json: {exc}"
          )

      expected_package = "com.idap360.app"

      packages = []

      for client in config.get("client", []):
          package_name = (
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
          )

          if package_name:
              packages.append(package_name)

      if expected_package not in packages:
          print(
              "##vso[task.logissue type=error]"
              "Firebase configuration does not contain "
              "com.idap360.app"
          )
          print("Firebase packages found:", packages)
          raise SystemExit(1)

      print("Firebase configuration validated.")
      print("Package:", expected_package)
      PY

    displayName: 'Copy and validate Firebase configuration'

  # 9. Validate release signing configuration
  - bash: |
      set -e

      if [ -z "$MYAPP_UPLOAD_STORE_PASSWORD" ]; then
        echo "##vso[task.logissue type=error]Keystore password is missing."
        exit 1
      fi

      if [ -z "$MYAPP_UPLOAD_KEY_ALIAS" ]; then
        echo "##vso[task.logissue type=error]Key alias is missing."
        exit 1
      fi

      if [ -z "$MYAPP_UPLOAD_KEY_PASSWORD" ]; then
        echo "##vso[task.logissue type=error]Key password is missing."
        exit 1
      fi

      if [ ! -f "$IDAP_KEYSTORE_PATH" ]; then
        echo "##vso[task.logissue type=error]Release keystore not found."
        exit 1
      fi

      echo "Release keystore found."
      echo "Signing configuration validated."

    displayName: 'Validate Android release signing'

    env:
      IDAP_KEYSTORE_PATH: $(idapKeystore.secureFilePath)
      MYAPP_UPLOAD_STORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      MYAPP_UPLOAD_KEY_ALIAS: $(ANDROID_KEY_ALIAS)
      MYAPP_UPLOAD_KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)

  # 10. Build signed Release APK
  - bash: |
      set -e

      chmod +x gradlew

      echo "Checking Hermes property:"
      grep '^hermesEnabled=' gradle.properties

      ./gradlew assembleRelease \
        "-PMYAPP_UPLOAD_STORE_FILE=$IDAP_KEYSTORE_PATH" \
        "-PMYAPP_UPLOAD_STORE_PASSWORD=$MYAPP_UPLOAD_STORE_PASSWORD" \
        "-PMYAPP_UPLOAD_KEY_ALIAS=$MYAPP_UPLOAD_KEY_ALIAS" \
        "-PMYAPP_UPLOAD_KEY_PASSWORD=$MYAPP_UPLOAD_KEY_PASSWORD" \
        --stacktrace \
        --no-daemon

    workingDirectory: '$(Build.SourcesDirectory)/android'

    displayName: 'Build signed Android Release APK'

    env:
      IDAP_KEYSTORE_PATH: $(idapKeystore.secureFilePath)
      MYAPP_UPLOAD_STORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      MYAPP_UPLOAD_KEY_ALIAS: $(ANDROID_KEY_ALIAS)
      MYAPP_UPLOAD_KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)

  # 11. Build signed Release AAB
  - bash: |
      set -e

      ./gradlew bundleRelease \
        "-PMYAPP_UPLOAD_STORE_FILE=$IDAP_KEYSTORE_PATH" \
        "-PMYAPP_UPLOAD_STORE_PASSWORD=$MYAPP_UPLOAD_STORE_PASSWORD" \
        "-PMYAPP_UPLOAD_KEY_ALIAS=$MYAPP_UPLOAD_KEY_ALIAS" \
        "-PMYAPP_UPLOAD_KEY_PASSWORD=$MYAPP_UPLOAD_KEY_PASSWORD" \
        --stacktrace \
        --no-daemon

    workingDirectory: '$(Build.SourcesDirectory)/android'

    displayName: 'Build signed Android Release AAB'

    env:
      IDAP_KEYSTORE_PATH: $(idapKeystore.secureFilePath)
      MYAPP_UPLOAD_STORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      MYAPP_UPLOAD_KEY_ALIAS: $(ANDROID_KEY_ALIAS)
      MYAPP_UPLOAD_KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)

  # 12. Collect Release APK
  - bash: |
      set -e

      OUTPUT="$(Build.ArtifactStagingDirectory)/Android-Release-APK"
      SOURCE="$(Build.SourcesDirectory)/$(APK_OUTPUT_PATH)"

      mkdir -p "$OUTPUT"

      if [ ! -d "$SOURCE" ]; then
        echo "##vso[task.logissue type=error]APK output directory not found."
        exit 1
      fi

      find "$SOURCE" -type f -name '*.apk' \
        -exec cp {} "$OUTPUT/" \;

      if ! find "$OUTPUT" -type f -name '*.apk' -print -quit | grep -q .; then
        echo "##vso[task.logissue type=error]Release APK was not generated."
        exit 1
      fi

      echo "APK collected successfully."
      ls -lh "$OUTPUT"

    displayName: 'Collect Release APK'

  # 13. Collect Release AAB
  - bash: |
      set -e

      OUTPUT="$(Build.ArtifactStagingDirectory)/Android-Release-AAB"
      SOURCE="$(Build.SourcesDirectory)/$(AAB_OUTPUT_PATH)"

      mkdir -p "$OUTPUT"

      if [ ! -d "$SOURCE" ]; then
        echo "##vso[task.logissue type=error]AAB output directory not found."
        exit 1
      fi

      find "$SOURCE" -type f -name '*.aab' \
        -exec cp {} "$OUTPUT/" \;

      if ! find "$OUTPUT" -type f -name '*.aab' -print -quit | grep -q .; then
        echo "##vso[task.logissue type=error]Release AAB was not generated."
        exit 1
      fi

      echo "AAB collected successfully."
      ls -lh "$OUTPUT"

    displayName: 'Collect Release AAB'

  # 14. Publish Release APK
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Release APK'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/Android-Release-APK'
      artifact: 'Android-Release-APK'
      publishLocation: 'pipeline'

  # 15. Publish Release AAB
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Release AAB'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/Android-Release-AAB'
      artifact: 'Android-Release-AAB'
      publishLocation: 'pipeline'
