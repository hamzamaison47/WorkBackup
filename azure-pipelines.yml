trigger:
  branches:
    include:
      - operational

pr:
  none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'
  APP_SCHEME: 'Authentication'
  JAVA_VERSION: '17'
  BUILD_VARIANT: 'assembleRelease'
  APK_OUTPUT_PATH: 'android/app/build/outputs/apk/release'

stages:

# ─────────────────────────────
# INSTALL STAGE
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - task: CmdLine@2
          displayName: Install dependencies
          inputs:
            script: |
              node -v
              npm ci --legacy-peer-deps

# ─────────────────────────────
# ANDROID BUILD
# ─────────────────────────────
- stage: Android
  displayName: Build Android APK
  dependsOn: Install
  jobs:
    - job: BuildAPK
      pool:
        vmImage: 'ubuntu-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - task: Cache@2
          inputs:
            key: 'npm | "$(Agent.OS)" | package-lock.json'
            path: node_modules

        - task: CmdLine@2
          displayName: Install dependencies
          inputs:
            script: npm install --legacy-peer-deps

        - task: JavaToolInstaller@0
          inputs:
            versionSpec: '$(JAVA_VERSION)'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'

        - task: CmdLine@2
          displayName: Decode Keystore
          inputs:
            script: |
              echo "$(KEYSTORE_BASE64)" | base64 --decode > android/app/release.keystore

        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: google-services.json

        - task: CmdLine@2
          displayName: Copy google-services.json
          inputs:
            script: cp $(googleServices.secureFilePath) android/app/google-services.json

        - task: CmdLine@2
          displayName: Build Android
          inputs:
            script: |
              cd android
              chmod +x gradlew
              ./gradlew $(BUILD_VARIANT) \
                -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
                -PMYAPP_UPLOAD_STORE_PASSWORD=$(STORE_PASSWORD) \
                -PMYAPP_UPLOAD_KEY_ALIAS=$(KEY_ALIAS) \
                -PMYAPP_UPLOAD_KEY_PASSWORD=$(KEY_PASSWORD) \
                --no-daemon --stacktrace

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(APK_OUTPUT_PATH)
            artifactName: android-release

# ─────────────────────────────
# iOS BUILD (FIXED + STABLE)
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: build
      pool:
        vmImage: 'macos-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - task: CmdLine@2
          displayName: Install JS deps
          inputs:
            script: npm ci --legacy-peer-deps

        # ─────────────────────────────
        # POD INSTALL (ROBUST FIX)
        # ─────────────────────────────
        - task: CmdLine@2
          displayName: Install CocoaPods (stable)
          inputs:
            script: |
              set -e
              cd ios

              rm -rf Pods Podfile.lock

              # 🔧 Fix CI git instability (ZXingObjC fix)
              git config --global http.postBuffer 524288000
              git config --global http.maxRequestBuffer 100M
              git config --global core.compression 0
              git config --global http.lowSpeedLimit 0
              git config --global http.lowSpeedTime 999999

              pod install --repo-update || pod install --repo-update || pod install --repo-update

        # ─────────────────────────────
        # CLEAN BUILD
        # ─────────────────────────────
        - task: CmdLine@2
          displayName: Clean Xcode
          inputs:
            script: |
              xcodebuild clean \
                -workspace ios/Authentication.xcworkspace \
                -scheme $(APP_SCHEME)

        # ─────────────────────────────
        # ARCHIVE (IMPORTANT FIX)
        # ─────────────────────────────
        - task: CmdLine@2
          displayName: Build iOS Archive
          inputs:
            script: |
              set -e

              xcodebuild \
                -workspace ios/Authentication.xcworkspace \
                -scheme $(APP_SCHEME) \
                -configuration Release \
                -sdk iphoneos \
                -destination 'generic/platform=iOS' \
                clean archive \
                -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
                -allowProvisioningUpdates \
                | tee ios-build.log

        # ─────────────────────────────
        # EXPORT IPA
        # ─────────────────────────────
        - task: CmdLine@2
          displayName: Export IPA
          inputs:
            script: |
              xcodebuild -exportArchive \
                -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
                -exportPath $(Build.ArtifactStagingDirectory)/ipa \
                -exportOptionsPlist ios/exportOptions.plist

        # ─────────────────────────────
        # PUBLISH
        # ─────────────────────────────
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)
            artifactName: ios-release