trigger:
  branches:
    include:
      - operational   # your branch

pr: none

pool:
  vmImage: 'macos-latest'   # IMPORTANT: needed for React Native + iOS + Android

variables:
  NODE_VERSION: '16.x'

stages:

# ─────────────────────────────
# STAGE 1: INSTALL
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install packages

        - script: npm run lint --if-present
          displayName: Lint code

        - script: npm test --if-present
          displayName: Run tests


# ─────────────────────────────
# STAGE 2: ANDROID BUILD
# ─────────────────────────────
- stage: Android
  displayName: Build Android APK
  dependsOn: Install
  jobs:
    - job: android
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        - script: |
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          displayName: Build Android Release APK

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'android/app/build/outputs/apk/release'
            artifactName: 'android-apk'


# ─────────────────────────────
# STAGE 3: IOS BUILD
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: ios
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        - script: |
            cd ios
            pod install
          displayName: Install CocoaPods

        - script: |
            xcodebuild -workspace ios/*.xcworkspace \
            -scheme YOUR_APP_NAME \
            -configuration Release \
            archive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive
          displayName: Build iOS Archive

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'ios-build'