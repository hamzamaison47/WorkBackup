trigger:
  branches:
    include:
      - operational

pr:
  none

pool:
  vmImage: 'macos-latest'

variables:
  - name: NODE_VERSION
    value: '18.x'
  - name: APP_SCHEME
    value: 'Authentication'
  - name: JAVA_VERSION
    value: '17'
  - name: BUILD_VARIANT
    value: 'assembleRelease'
  - name: APK_OUTPUT_PATH
    value: 'android/app/build/outputs/apk/release'

stages:

# ─────────────────────────────
# INSTALL STAGE
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - task: CmdLine@2
          displayName: Install dependencies
          inputs:
            script: |
              node -v
              npm ci --legacy-peer-deps

# ─────────────────────────────
# ANDROID STAGE
# ─────────────────────────────
- stage: Android
  displayName: Build Android Release APK
  dependsOn: Install
  jobs:
    - job: BuildAPK
      pool:
        vmImage: 'ubuntu-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSource: 'spec'
            versionSpec: '$(NODE_VERSION)'

        - task: Cache@2
          displayName: Cache node_modules
          inputs:
            key: 'npm | "$(Agent.OS)" | package-lock.json'
            restoreKeys: |
              npm | "$(Agent.OS)"
            path: node_modules

        - task: CmdLine@2
          displayName: Install dependencies
          inputs:
            script: npm install --legacy-peer-deps

        - task: JavaToolInstaller@0
          inputs:
            versionSpec: '$(JAVA_VERSION)'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'

        - task: CmdLine@2
          displayName: Decode keystore
          inputs:
            script: |
              echo "$(KEYSTORE_BASE64)" | base64 --decode > android/app/release.keystore

        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: 'google-services.json'

        - task: CmdLine@2
          displayName: Copy google-services.json
          inputs:
            script: cp $(googleServices.secureFilePath) android/app/google-services.json

        - task: CmdLine@2
          displayName: Make gradlew executable
          inputs:
            script: chmod +x android/gradlew

        - task: CmdLine@2
          displayName: Build Android APK
          inputs:
            script: |
              cd android && ./gradlew $(BUILD_VARIANT) \
                -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
                -PMYAPP_UPLOAD_STORE_PASSWORD=$(STORE_PASSWORD) \
                -PMYAPP_UPLOAD_KEY_ALIAS=$(KEY_ALIAS) \
                -PMYAPP_UPLOAD_KEY_PASSWORD=$(KEY_PASSWORD) \
                --no-daemon --stacktrace

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(APK_OUTPUT_PATH)
            artifactName: Authentication-release-apk

# ─────────────────────────────
# iOS STAGE (FIXED)
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: build
      pool:
        vmImage: 'macos-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - task: CmdLine@2
          displayName: Install dependencies
          inputs:
            script: npm ci --legacy-peer-deps

        # ─────────────────────────────
        # 🔥 FIXED POD INSTALL (IMPORTANT)
        # ─────────────────────────────
        - task: CmdLine@2
          displayName: Install Pods (stable)
          inputs:
            script: |
              set -e
              cd ios

              rm -rf Pods Podfile.lock

              # 🔧 Fix CI git instability (ZXingObjC crash fix)
              git config --global http.postBuffer 524288000
              git config --global http.maxRequestBuffer 100M
              git config --global core.compression 0
              git config --global http.lowSpeedLimit 0
              git config --global http.lowSpeedTime 999999

              pod install --repo-update || pod install --repo-update || pod install --repo-update

        - task: CmdLine@2
          displayName: Clean Xcode
          inputs:
            script: |
              xcodebuild clean \
                -workspace ios/Authentication.xcworkspace \
                -scheme $(APP_SCHEME)

        - task: CmdLine@2
          displayName: Build iOS Archive
          inputs:
            script: |
              xcodebuild \
                -workspace ios/Authentication.xcworkspace \
                -scheme $(APP_SCHEME) \
                -configuration Release \
                archive \
                -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
                -allowProvisioningUpdates

        - task: CmdLine@2
          displayName: Export IPA
          inputs:
            script: |
              xcodebuild -exportArchive \
                -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
                -exportPath $(Build.ArtifactStagingDirectory)/ipa \
                -exportOptionsPlist ios/exportOptions.plist

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)
            artifactName: ios-build