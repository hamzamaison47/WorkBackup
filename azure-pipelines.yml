trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: IDAP-Release-Signing

  - name: NODE_VERSION
    value: '18.x'

  - name: JAVA_VERSION
    value: '17'

  - name: APK_OUTPUT_PATH
    value: 'android/app/build/outputs/apk/release'

  - name: AAB_OUTPUT_PATH
    value: 'android/app/build/outputs/bundle/release'

steps:
  # --------------------------------------------------
  # 1. Install Node.js
  # --------------------------------------------------
  - task: NodeTool@0
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '$(NODE_VERSION)'

  # --------------------------------------------------
  # 2. Install Java
  # --------------------------------------------------
  - task: JavaToolInstaller@0
    displayName: 'Install Java 17'
    inputs:
      versionSpec: '$(JAVA_VERSION)'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # --------------------------------------------------
  # 3. Verify installed tools
  # --------------------------------------------------
  - bash: |
      node --version
      npm --version
      java -version
    displayName: 'Verify Build Tools'

  # --------------------------------------------------
  # 4. Install npm dependencies
  # --------------------------------------------------
  - bash: |
      npm ci --legacy-peer-deps
    displayName: 'Install React Native Dependencies'

  # --------------------------------------------------
  # 5. Configure Hermes
  # Create android/gradle.properties automatically
  # --------------------------------------------------
  - bash: |
      python3 - <<'PY'
      from pathlib import Path

      path = Path("android/gradle.properties")
      path.parent.mkdir(parents=True, exist_ok=True)

      existing = path.read_text() if path.exists() else ""
      lines = [
          line for line in existing.splitlines()
          if not line.strip().startswith("hermesEnabled=")
      ]

      lines.append("hermesEnabled=true")
      path.write_text("\n".join(lines) + "\n")

      print("Updated android/gradle.properties:")
      print(path.read_text())
      PY
    displayName: 'Configure Hermes'

  # --------------------------------------------------
  # 6. Download Android release keystore
  # --------------------------------------------------
  - task: DownloadSecureFile@1
    name: idapKeystore
    displayName: 'Download IDAP Release Keystore'
    inputs:
      secureFile: 'IDAP-release-key.keystore'

  # --------------------------------------------------
  # 7. Download Firebase configuration
  # --------------------------------------------------
  - task: DownloadSecureFile@1
    name: googleServices
    displayName: 'Download Firebase Configuration'
    inputs:
      secureFile: 'google-services.json'

  # --------------------------------------------------
  # 8. Configure Firebase
  # --------------------------------------------------
  - bash: |
      set -e

      mkdir -p android/app
      cp "$(FIREBASE_FILE)" android/app/google-services.json

      echo "Checking Firebase package name..."

      python3 - <<'PY'
      import json

      path = "android/app/google-services.json"

      with open(path, "r") as file:
          data = json.load(file)

      expected = "com.idap360.app"

      packages = [
          client.get("client_info", {})
                .get("android_client_info", {})
                .get("package_name")
          for client in data.get("client", [])
      ]

      print("Firebase packages:", packages)

      if expected not in packages:
          raise SystemExit(
              f"ERROR: Firebase package {expected} was not found."
          )

      print("Firebase package validation successful.")
      PY
    displayName: 'Configure and Validate Firebase'
    env:
      FIREBASE_FILE: $(googleServices.secureFilePath)

  # --------------------------------------------------
  # 9. Validate signing configuration
  # --------------------------------------------------
  - bash: |
      set -e

      if [ -z "$KEYSTORE_PASSWORD" ]; then
        echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
        exit 1
      fi

      if [ -z "$KEY_ALIAS" ]; then
        echo "ERROR: ANDROID_KEY_ALIAS is missing."
        exit 1
      fi

      if [ -z "$KEY_PASSWORD" ]; then
        echo "ERROR: ANDROID_KEY_PASSWORD is missing."
        exit 1
      fi

      if [ ! -f "$KEYSTORE_PATH" ]; then
        echo "ERROR: Keystore file not found."
        exit 1
      fi

      echo "Signing configuration validation successful."
    displayName: 'Validate Android Signing Configuration'
    env:
      KEYSTORE_PATH: $(idapKeystore.secureFilePath)
      KEYSTORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      KEY_ALIAS: $(ANDROID_KEY_ALIAS)
      KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)

  # --------------------------------------------------
  # 10. Build signed APK
  # Skip the failing release lint report task temporarily
  # --------------------------------------------------
  - bash: |
      set -e

      chmod +x gradlew

      ./gradlew assembleRelease \
        -x lintVitalReportRelease \
        "-PMYAPP_UPLOAD_STORE_FILE=$KEYSTORE_PATH" \
        "-PMYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD" \
        "-PMYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS" \
        "-PMYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" \
        --stacktrace \
        --no-daemon

    workingDirectory: '$(Build.SourcesDirectory)/android'
    displayName: 'Build Signed Android APK'
    env:
      KEYSTORE_PATH: $(idapKeystore.secureFilePath)
      KEYSTORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      KEY_ALIAS: $(ANDROID_KEY_ALIAS)
      KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)

  # --------------------------------------------------
  # 11. Build signed AAB
  # --------------------------------------------------
  - bash: |
      set -e

      chmod +x gradlew

      ./gradlew bundleRelease \
        -x lintVitalReportRelease \
        "-PMYAPP_UPLOAD_STORE_FILE=$KEYSTORE_PATH" \
        "-PMYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD" \
        "-PMYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS" \
        "-PMYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" \
        --stacktrace \
        --no-daemon

    workingDirectory: '$(Build.SourcesDirectory)/android'
    displayName: 'Build Signed Android AAB'
    env:
      KEYSTORE_PATH: $(idapKeystore.secureFilePath)
      KEYSTORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      KEY_ALIAS: $(ANDROID_KEY_ALIAS)
      KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)

  # --------------------------------------------------
  # 12. Collect APK
  # --------------------------------------------------
  - bash: |
      set -e

      mkdir -p "$(Build.ArtifactStagingDirectory)/APK"

      find "$(APK_PATH)" -maxdepth 1 -type f -name "*.apk" \
        -exec cp {} "$(Build.ArtifactStagingDirectory)/APK/" \;

      if ! ls "$(Build.ArtifactStagingDirectory)/APK/"*.apk >/dev/null 2>&1; then
        echo "ERROR: APK file was not generated."
        exit 1
      fi
    displayName: 'Collect APK'
    env:
      APK_PATH: $(Build.SourcesDirectory)/$(APK_OUTPUT_PATH)

  # --------------------------------------------------
  # 13. Collect AAB
  # --------------------------------------------------
  - bash: |
      set -e

      mkdir -p "$(Build.ArtifactStagingDirectory)/AAB"

      find "$(AAB_PATH)" -maxdepth 1 -type f -name "*.aab" \
        -exec cp {} "$(Build.ArtifactStagingDirectory)/AAB/" \;

      if ! ls "$(Build.ArtifactStagingDirectory)/AAB/"*.aab >/dev/null 2>&1; then
        echo "ERROR: AAB file was not generated."
        exit 1
      fi
    displayName: 'Collect AAB'
    env:
      AAB_PATH: $(Build.SourcesDirectory)/$(AAB_OUTPUT_PATH)

  # --------------------------------------------------
  # 14. Publish APK artifact
  # --------------------------------------------------
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Android APK'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/APK'
      ArtifactName: 'Android-Release-APK'
      publishLocation: 'Container'

  # --------------------------------------------------
  # 15. Publish AAB artifact
  # --------------------------------------------------
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Android AAB'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/AAB'
      ArtifactName: 'Android-Release-AAB'
      publishLocation: 'Container'
