trigger:
  branches:
    include:
      - operational

pr:
  none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'
  APP_SCHEME: 'Authentication'
  JAVA_VERSION: '17'
  BUILD_VARIANT: 'assembleRelease'
  APK_OUTPUT_PATH: 'android/app/build/outputs/apk/release'

stages:

# ─────────────────────────────
# INSTALL
# ─────────────────────────────
- stage: Install
  jobs:
    - job: setup
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install dependencies

# ─────────────────────────────
# ANDROID
# ─────────────────────────────
- stage: Android
  dependsOn: Install
  jobs:
    - job: BuildAndroid
      pool:
        vmImage: 'ubuntu-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm install --legacy-peer-deps
          displayName: Install JS deps

        # ✅ FIXED JAVA TOOL INSTALLER
        - task: JavaToolInstaller@0
          inputs:
            versionSpec: '$(JAVA_VERSION)'
            jdkArchitectureOption: 'x64'

        - script: |
            echo "$(KEYSTORE_BASE64)" | base64 --decode > android/app/release.keystore
          displayName: Decode keystore

        - task: DownloadSecureFile@1
          name: googleServices
          inputs:
            secureFile: google-services.json

        - script: cp $(googleServices.secureFilePath) android/app/google-services.json
          displayName: Copy google-services.json

        - script: |
            cd android
            chmod +x gradlew
            ./gradlew $(BUILD_VARIANT) --no-daemon --stacktrace
          displayName: Build Android

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(APK_OUTPUT_PATH)
            artifactName: android-release

# ─────────────────────────────
# iOS
# ─────────────────────────────
- stage: iOS
  dependsOn: Install
  jobs:
    - job: BuildiOS
      pool:
        vmImage: 'macos-latest'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install JS deps

        # ─────────────────────────────
        # POD INSTALL
        # ─────────────────────────────
        - script: |
            set -e
            cd ios

            rm -rf Pods Podfile.lock

            git config --global http.postBuffer 524288000
            git config --global core.compression 0

            pod install --repo-update || pod install --repo-update || pod install --repo-update
          displayName: Install CocoaPods

        # ─────────────────────────────
        # CLEAN
        # ─────────────────────────────
        - script: |
            xcodebuild clean \
              -workspace ios/Authentication.xcworkspace \
              -scheme $(APP_SCHEME)
          displayName: Clean Xcode

        # ─────────────────────────────
        # ARCHIVE
        # ─────────────────────────────
        - script: |
            set -e

            ARCHIVE_DIR="$(Pipeline.Workspace)/ios-build"
            ARCHIVE_PATH="$ARCHIVE_DIR/app.xcarchive"

            mkdir -p "$ARCHIVE_DIR"

            xcodebuild \
              -workspace ios/Authentication.xcworkspace \
              -scheme $(APP_SCHEME) \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              clean archive \
              -archivePath "$ARCHIVE_PATH" \
              -allowProvisioningUpdates

            if [ ! -d "$ARCHIVE_PATH" ]; then
              echo "❌ Archive not created!"
              exit 1
            fi

            ls -la "$ARCHIVE_DIR"
          displayName: Build iOS Archive

        # ─────────────────────────────
        # EXPORT IPA (FIXED)
        # ─────────────────────────────
        - script: |
            set -e

            ARCHIVE_PATH="$(Pipeline.Workspace)/ios-build/app.xcarchive"

            echo "Using archive: $ARCHIVE_PATH"

            ls -R "$(Pipeline.Workspace)/ios-build"

            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$(Build.ArtifactStagingDirectory)/ipa" \
              -exportOptionsPlist ios/exportOptions.plist
          displayName: Export IPA

        # ─────────────────────────────
        # PUBLISH
        # ─────────────────────────────
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)
            artifactName: ios-release