trigger:
  branches:
    include:
      - operational

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  NODE_VERSION: '18.x'

stages:

# ─────────────────────────────
# STAGE 1: INSTALL
# ─────────────────────────────
- stage: Install
  displayName: Install Dependencies
  jobs:
    - job: setup
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'
          displayName: Install Node

        - script: |
            node -v
            npm ci --legacy-peer-deps
          displayName: Install dependencies

        - script: npm run lint --if-present
          displayName: Lint

        - script: npm test --if-present
          displayName: Test


# ─────────────────────────────
# STAGE 2: ANDROID BUILD (FIXED)
# ─────────────────────────────
- stage: Android
  displayName: Build Android APK
  dependsOn: Install
  jobs:
    - job: android
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        # 🔥 USE YOUR UPLOADED DEBUG KEYSTORE
        - task: DownloadSecureFile@1
          name: keystoreFile
          inputs:
            secureFile: 'debug.keystore'

        - script: |
            mkdir -p android/app
            cp $(keystoreFile.secureFilePath) android/app/debug.keystore
          displayName: Place keystore file

        - script: |
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          displayName: Build Android Release APK

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'android/app/build/outputs/apk/release'
            artifactName: 'android-apk'


# ─────────────────────────────
# STAGE 3: IOS BUILD (FULL FIXED)
# ─────────────────────────────
- stage: iOS
  displayName: Build iOS IPA
  dependsOn: Install
  jobs:
    - job: ios
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm ci --legacy-peer-deps
          displayName: Install dependencies

        - script: |
            cd ios
            pod install
          displayName: Install CocoaPods

        # 🔥 ARCHIVE STEP
        - script: |
            xcodebuild -workspace ios/Authentication.xcworkspace \
            -scheme Authentication \
            -configuration Release \
            archive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive
          displayName: Build iOS Archive

        # 🔥 EXPORT IPA STEP (IMPORTANT)
        - script: |
            xcodebuild -exportArchive \
            -archivePath $(Build.ArtifactStagingDirectory)/app.xcarchive \
            -exportPath $(Build.ArtifactStagingDirectory)/ipa \
            -exportOptionsPlist ios/exportOptions.plist
          displayName: Export IPA

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'ios-build'