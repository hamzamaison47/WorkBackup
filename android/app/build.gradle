apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * React Native Configuration
 */
react {
    /* Default configuration is sufficient for most apps */
}

/**
 * Proguard Configuration
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore Flavor
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    compileSdkVersion 34

    namespace "com.authentication"
    
    defaultConfig {
        applicationId "com.authentication"
        minSdkVersion 24  // Minimum for @react-native-voice/voice
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        manifestPlaceholders = [
            appAuthRedirectScheme: 'com.authentication.callback',
        ]
        
        missingDimensionStrategy 'react-native-camera', 'general'
        
        // Multi-dex support (important for large apps)
        multiDexEnabled true
    }
    
    // ============================================
    // JAVA/KOTLIN COMPATIBILITY - CRITICAL
    // ============================================
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    // ============================================
    // PACKAGING OPTIONS
    // ============================================
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        
        // Exclude duplicate files
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }

    // ============================================
    // SIGNING CONFIGURATIONS
    // ============================================
    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // ============================================
    // BUILD TYPES
    // ============================================
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            
            // Shrink resources in release builds
            shrinkResources enableProguardInReleaseBuilds
        }
    }
}

// ============================================
// DEPENDENCY RESOLUTION STRATEGY
// ============================================
configurations.all {
    resolutionStrategy {
        // Force specific Kotlin versions
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
        
        // Force Google Play Services versions
        force 'com.google.android.gms:play-services-base:18.3.0'
        force 'com.google.android.gms:play-services-tasks:18.1.0'
        force 'com.google.android.gms:play-services-measurement:21.5.0'
        force 'com.google.android.gms:play-services-measurement-api:21.5.0'
        force 'com.google.android.gms:play-services-measurement-impl:21.5.0'
        
        // Force Firebase versions
        force 'com.google.firebase:firebase-messaging:23.4.0'
        force 'com.google.firebase:firebase-analytics:21.5.0'
        force 'com.google.firebase:firebase-messaging-ktx:23.4.0'
        force 'com.google.firebase:firebase-analytics-ktx:21.5.0'
        
        // Force AndroidX versions
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.appcompat:appcompat:1.6.1'
    }
}

// ============================================
// DEPENDENCIES
// ============================================
dependencies {
    // ==========================================
    // REACT NATIVE CORE
    // ==========================================
    implementation("com.facebook.react:react-android")
    
    // ==========================================
    // REACT NATIVE MODULES
    // ==========================================
    implementation project(':react-native-vector-icons')
    implementation project(':react-native-splash-screen')
    implementation project(':react-native-device-info')
    
    // ==========================================
    // FIREBASE
    // ==========================================
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    
    // ==========================================
    // KOTLIN
    // ==========================================
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
    
    // ==========================================
    // ANDROIDX LIBRARIES
    // ==========================================
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    
    // Multi-dex support
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ==========================================
    // GOOGLE PLAY SERVICES (for Speech Recognition)
    // ==========================================
    // These are CRITICAL for @react-native-voice/voice
    implementation 'com.google.android.gms:play-services-base:18.3.0'
    implementation 'com.google.android.gms:play-services-tasks:18.1.0'
    
    // ==========================================
    // JAVASCRIPT ENGINE
    // ==========================================
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// ============================================
// APPLY NATIVE MODULES
// ============================================
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)